# dsh-session-suite — session checkpoints, rewind, delete, share, and long-term memory.
#
# One row: the Host half registers the authenticated Fetch route, turns the
# per-turn workspace snapshots, and runs the long-term memory engine; the Client
# half adds the sidebar rows, the message actions, and the settings pages.
- insert:
    - id: session-suite
      name: dsh-session-suite
      config:
        # ---------- session snapshots ----------
        # Automatic checkpoints kept per session (locked ones do not count).
        keep: 10
        # Capture a workspace checkpoint when each turn finishes.
        autoCheckpoint: true
        # Files larger than this are skipped.
        maxFileBytes: 2097152
        # Hard cap on tracked files per checkpoint.
        maxFiles: 4000
        # How often expired undo bundles are swept.
        sweepIntervalMs: 300000
        # Extra ignore patterns on top of the built-in list.
        ignore: []

        # ---------- output hygiene ----------
        # Strip the four internal step tags from streamed text/reasoning before
        # they can reach the assistant message, the transcript, share exports,
        # or a later replayed request. Host-side `llm/stream` filter; set false
        # to pass model output through untouched.
        stripStepTags: true

        # ---------- long-term memory ----------
        # Turn the whole memory engine on or off.
        longTermMemory: true
        # Model chain used for implicit extraction (one cheap call per turn).
        # Tried in order until one answers; a 429 or an unreachable provider just
        # moves on to the next entry. All of these are free tiers.
        memoryModels:
          - provider: agnes
            model: agnes-3.0-flash
          - provider: agnes-backup
            model: agnes-3.0-flash
          - provider: zhipu
            model: glm-4.7-flash
          - provider: siliconflow
            model: Qwen/Qwen2.5-7B-Instruct
        # How many memories one recall may inject into the prompt. This is a
        # ceiling, not a quota: a weak question injects fewer, because filling
        # the budget would claim six memories are relevant when the evidence
        # says otherwise.
        recallLimit: 6
        # How many of the most important memories ride along regardless of the
        # question. Without a resident layer, an ordinary follow-up like "继续"
        # shares no vocabulary with any memory and a strict relevance filter
        # would inject nothing at all, which reads as the feature being broken.
        residentLimit: 2
        # Use the general-purpose Chinese word list as a third retrieval route.
        # It fixes character-bigram over-matching across word boundaries; the
        # ablation in tools/ablate-word-route.mjs shows it raises MRR without
        # lowering recall@5. Set false to run the two lexical routes alone.
        wordRoute: true
        # BM25 term-frequency saturation and length normalisation, and the RRF
        # smoothing constant. Defaults are the customary ones; lower bm25K1
        # saturates repeated terms sooner, bm25B 0 disables length normalisation.
        bm25K1: 1.5
        bm25B: 0.75
        rrfK: 60
        # Similarity above which a new memory reinforces an existing one.
        duplicateSimilarity: 0.82
        # Similarity above which two memories may join one cluster.
        clusterSimilarity: 0.5
        # Cluster size that triggers compression into one summary.
        clusterMinSize: 2
        # Number of same-tag memories that triggers a rule-type abstraction.
        ruleMinSize: 3
        # Images inlined into a shared page, and the per-image ceiling.
        imageBudget: 12
        imageMaxBytes: 3145728
